name: Atualizar agenda

# Roda todo dia de manha e sempre que voce quiser (botao "Run workflow").
# Busca a agenda nova no TVmaze e, se algo mudou, faz commit sozinho. O
# Cloudflare ve o commit e republica o site — voce nao precisa fazer nada.
on:
  schedule:
    # 06:17 UTC = 03:17 no horario de Brasilia. FORA DA HORA CHEIA de proposito:
    # o GitHub atrasa os agendamentos da hora cheia, que e quando todo mundo
    # marca. Com "0 9 * * *" o robo rodou as 13:36, 14:33 e 17:21 UTC nos dias
    # 26 a 28/09/2026 — a agenda do dia chegava a tarde. Cedo e fora da hora
    # cheia, mesmo um atraso de horas ainda entrega a agenda de manha.
    - cron: "17 6 * * *"
  workflow_dispatch:

# Necessario para o job conseguir fazer commit de volta no repositorio.
permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Buscar a agenda no TVmaze
        run: node scripts/fetch-agenda.mjs

      # O RANKING DE TODOS OS TEMPOS so as segundas, e sempre que alguem
      # dispara o robo a mao: nota muda devagar, e ele baixa o indice inteiro do
      # TVmaze — umas 370 paginas, que nao ha por que pedir todo dia. Roda DEPOIS
      # da agenda, no mesmo job, porque os dois escrevem o titulos-br.json; em
      # jobs separados, um commit atropelaria o outro.
      - name: Montar o ranking de todos os tempos (segundas)
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/fetch-ranking.mjs
          else
            echo "Hoje nao e segunda: o ranking fica como esta."
          fi

      - name: Fazer commit se houver mudanca
        run: |
          # Olha os TRES arquivos, e o `git add` lista os mesmos tres: caminho
          # explicito no add deixa de fora o que nao esta na lista, e um arquivo
          # gerado que nunca e commitado e o defeito mais silencioso que existe
          # — o script grava, o CI descarta, e ninguem ve erro nenhum. (Licao do
          # Conexão Anime.)
          ARQUIVOS="src/data/agenda.json src/data/titulos-br.json src/data/ranking.json"
          if git diff --quiet -- $ARQUIVOS; then
            echo "Nada mudou no TVmaze hoje."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $ARQUIVOS
          git commit -m "chore: atualiza a agenda de series"
          # Nas segundas o job leva uns 15 minutos, e um push de outra pessoa
          # nesse meio tempo faria o nosso ser recusado. O robo so mexe nos
          # arquivos de dados, entao trazer o que chegou antes nao conflita.
          git pull --rebase origin main
          git push
